name: Deploy Telegram Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgcloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate syntax, imports and run test suite
        run: npm run validate

      # Fetch remote cloud revision metadata to check for concurrency conflicts.
      # Note: tgcloud fetch updates local revision records and does not merge or overwrite repository working files.
      - name: Sync cloud revision metadata
        run: npx tgcloud fetch
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}

      # Push changes to TGCloud. Never pass --force so remote revision conflicts safely abort deployment.
      - name: Deploy to TGCloud
        run: npx tgcloud push
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
