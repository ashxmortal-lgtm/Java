name: Deploy ExFrozen Study (app8868570312)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgcloud-deploy-app8868570312
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate syntax, imports and run test suite
        run: npm run validate

      # Guard: this workflow may ONLY deploy app8868570312. If the token embeds an
      # app-id (app<digits> prefix/segment) it must match; a token for the
      # other bot fails the job before anything is pushed.
      - name: Verify token targets app8868570312
        if: github.event_name != 'pull_request'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN_EXFROZEN }}
          EXPECTED_APP: app8868570312
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then echo "::error::Secret TGCLOUD_TOKEN_EXFROZEN is not set"; exit 1; fi
          FOUND=$(printf '%s' "$TGCLOUD_TOKEN" | grep -oE 'app[0-9]{6,}' | head -n1 || true)
          if [ -n "$FOUND" ] && [ "$FOUND" != "$EXPECTED_APP" ]; then
            echo "::error::Token targets $FOUND, expected $EXPECTED_APP. Refusing to deploy."
            exit 1
          fi
          if [ -z "$FOUND" ]; then
            echo "::warning::Token carries no embedded app-id; relying on secret scoping. Confirm TGCLOUD_TOKEN_EXFROZEN was issued for $EXPECTED_APP in the TGCloud dashboard."
          else
            echo "Token app-id verified: $FOUND"
          fi
          grep -q "$EXPECTED_APP" tgcloud/lib/config.js || { echo "::error::config.js does not target $EXPECTED_APP"; exit 1; }

      - name: Sync cloud revision metadata
        if: github.event_name != 'pull_request'
        run: npx tgcloud fetch
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN_EXFROZEN }}

      - name: Deploy to TGCloud (app8868570312 only)
        if: github.event_name != 'pull_request'
        run: npx tgcloud push
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN_EXFROZEN }}
