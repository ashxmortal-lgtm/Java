<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="View your Frozen Blooded Telegram bot profile.">
  <title>Frozen Blooded — Profile</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/profile.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="profile-app" class="profile-shell" aria-live="polite">
    <header class="profile-top">
      <div class="mark" aria-hidden="true">❄</div>
      <div>
        <div class="brand">FROZEN BLOODED</div>
        <div class="sub">Your bot-synced shinobi profile</div>
      </div>
    </header>

    <section class="profile-intro">
      <div class="profile-eyebrow">ACCOUNT</div>
      <h1>Your Profile</h1>
      <p>Rank, stats, roster, and jutsu from the same profile data used by <code>/profile</code>.</p>
    </section>

    <div id="profile-state" class="notice" role="status">Connecting to Telegram…</div>
    <button id="profile-retry" class="secondary profile-retry" type="button" hidden>Try again</button>
    <section id="profile-content" class="profile-content" aria-label="Your bot profile"></section>
  </main>
  <script src="/js/profile.js"></script>
</body>
</html>
